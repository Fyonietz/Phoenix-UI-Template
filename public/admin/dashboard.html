<!DOCTYPE html>
<html lang="en">
  <head>
      @meta(title="Dashboard")
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
@meta;
  </head>
  <style>
    /* Make sidebar fixed height full viewport */
    aside {
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 16rem; /* w-64 */
      overflow: auto;
    }
    main {
      margin-left: 16rem; /* sidebar width */
      padding-bottom: 4.5rem; /* footer height + padding */
      height: calc(100vh - 4.5rem); /* full height minus footer */
      overflow-y: auto;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 16rem; /* to align right of sidebar */
      right: 0;
      height: 4.5rem; /* 18 * 4 px padding */
      background: white;
      box-shadow: inset 0 1px 0 #e5e7eb;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
  <body class="flex flex-col min-h-screen bg-gray-100" x-data="dashboard()">

  <!-- Wrapper -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white shadow-lg p-6 flex flex-col">
      <h2 class="text-2xl font-bold mb-6 text-indigo-600">Admin Panel</h2>
      <nav class="flex flex-col space-y-3 flex-grow">
        <button 
          class="text-left px-4 py-2 rounded hover:bg-indigo-100 transition"
          :class="currentView === 'dashboard' ? 'bg-indigo-200 font-semibold' : ''"
          @click="changeView('dashboard')"
        >
          Dashboard
        </button>
        <button 
          class="text-left px-4 py-2 rounded hover:bg-indigo-100 transition"
          :class="currentView === 'users' ? 'bg-indigo-200 font-semibold' : ''"
          @click="changeView('users')"
        >
          Users
        </button>
        <button 
          class="text-left px-4 py-2 rounded hover:bg-indigo-100 transition"
          :class="currentView === 'settings' ? 'bg-indigo-200 font-semibold' : ''"
          @click="changeView('settings')"
        >
          Settings
        </button>
      </nav>
      <div class="mt-auto text-xs text-gray-400">
        &copy; 2025 Your Company
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 p-8 overflow-y-auto pb-20">
      <template x-if="currentView === 'dashboard'">
        <section class="space-y-6">
          <h1 class="text-3xl font-bold mb-4">Dashboard Overview</h1>
          <p>Welcome to your admin dashboard! Here is a summary of your system.</p>
          <!-- Example cards -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded shadow p-4">
              <h3 class="font-semibold text-lg">Users</h3>
              <p class="text-2xl mt-2">1,234</p>
              <p class="text-sm text-gray-500 mt-1">Active users in the last month</p>
            </div>
            <div class="bg-white rounded shadow p-4">
              <h3 class="font-semibold text-lg">Revenue</h3>
              <p class="text-2xl mt-2">$45,678</p>
              <p class="text-sm text-gray-500 mt-1">Total revenue this quarter</p>
            </div>
            <div class="bg-white rounded shadow p-4">
              <h3 class="font-semibold text-lg">Performance</h3>
              <p class="text-2xl mt-2">87%</p>
              <p class="text-sm text-gray-500 mt-1">System uptime this month</p>
            </div>
          </div>
          <div class="bg-white rounded shadow p-6 mt-6">
            <h2 class="text-xl font-semibold mb-3">Recent Activity</h2>
            <ul class="list-disc list-inside space-y-2 text-gray-700">
              <li>User Alice updated her profile</li>
              <li>New user Bob Smith registered</li>
              <li>System backup completed successfully</li>
              <li>Settings updated for email notifications</li>
              <li>Monthly report generated</li>
              <li>User Carol White reset her password</li>
              <li>New admin permissions assigned to Alice</li>
              <li>Server maintenance scheduled</li>
              <li>Performance metrics reviewed</li>
              <li>Security audit completed</li>
            </ul>
          </div>
        </section>
      </template>

      <template x-if="currentView === 'users'">
        <section>
          <h1 class="text-3xl font-bold mb-4">User Management</h1>
          <p>Manage your users here.</p>
          <table class="w-full text-left mt-6 border-collapse border border-gray-200 rounded overflow-hidden">
            <thead class="bg-indigo-100">
              <tr>
                <th class="p-3 border border-indigo-300">ID</th>
                <th class="p-3 border border-indigo-300">Name</th>
                <th class="p-3 border border-indigo-300">Email</th>
                <th class="p-3 border border-indigo-300">Role</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="user in users" :key="user.id">
                <tr class="hover:bg-indigo-50">
                  <td class="p-3 border border-indigo-300" x-text="user.id"></td>
                  <td class="p-3 border border-indigo-300" x-text="user.name"></td>
                  <td class="p-3 border border-indigo-300" x-text="user.email"></td>
                  <td class="p-3 border border-indigo-300" x-text="user.role"></td>
                </tr>
              </template>
            </tbody>
          </table>

          <div class="mt-8 bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-3">Add New User</h2>
            <form @submit.prevent="addUser" class="space-y-4 max-w-md">
              <div>
                <label class="block mb-1 font-semibold" for="name">Name</label>
                <input type="text" id="name" x-model="newUser.name" required class="w-full px-3 py-2 border rounded" />
              </div>
              <div>
                <label class="block mb-1 font-semibold" for="email">Email</label>
                <input type="email" id="email" x-model="newUser.email" required class="w-full px-3 py-2 border rounded" />
              </div>
              <div>
                <label class="block mb-1 font-semibold" for="role">Role</label>
                <select id="role" x-model="newUser.role" class="w-full px-3 py-2 border rounded">
                  <option>Admin</option>
                  <option>Editor</option>
                  <option>Subscriber</option>
                </select>
              </div>
              <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
                Add User
              </button>
            </form>
          </div>
        </section>
      </template>

      <template x-if="currentView === 'settings'">
        <section class="space-y-6 max-w-md">
          <h1 class="text-3xl font-bold mb-4">Settings</h1>
          <p>Configure your system settings.</p>
          <form class="space-y-4">
            <div>
              <label for="email-notifications" class="block font-semibold mb-1">Email Notifications</label>
              <input type="checkbox" id="email-notifications" x-model="settings.emailNotifications" class="mr-2 leading-tight">
              <span>Enable email notifications</span>
            </div>
            <div>
              <label for="auto-updates" class="block font-semibold mb-1">Auto Updates</label>
              <input type="checkbox" id="auto-updates" x-model="settings.autoUpdates" class="mr-2 leading-tight">
              <span>Enable automatic updates</span>
            </div>
            <div>
              <label for="timezone" class="block font-semibold mb-1">Timezone</label>
              <select id="timezone" x-model="settings.timezone" class="w-full px-3 py-2 border rounded">
                <option value="UTC">UTC</option>
                <option value="PST">Pacific Standard Time (PST)</option>
                <option value="EST">Eastern Standard Time (EST)</option>
                <option value="CET">Central European Time (CET)</option>
              </select>
            </div>
            <button type="button" @click="saveSettings" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">
              Save Settings
            </button>
          </form>

          <div class="mt-6 bg-white p-4 rounded shadow">
            <h2 class="font-semibold mb-2">System Info</h2>
            <ul class="text-gray-700 list-disc list-inside">
              <li>App Version: 1.2.3</li>
              <li>Last Update: 2025-09-01</li>
              <li>Status: All systems operational</li>
            </ul>
          </div>
        </section>
      </template>
    </main>
  </div>

  <!-- Footer -->
   <footer class="fixed bottom-0 left-64 right-0 bg-white shadow-inner p-4 text-center text-gray-500 text-sm z-[1000]">
    &copy; 2025 Your Company. All rights reserved.
  </footer>  

    <script>
    function dashboard() {
      return {
        currentView: 'dashboard',
        users: [
          {id: 1, name: 'Alice Johnson', email: 'alice@example.com', role: 'Admin'},
          {id: 2, name: 'Bob Smith', email: 'bob@example.com', role: 'Editor'},
          {id: 3, name: 'Carol White', email: 'carol@example.com', role: 'Subscriber'},
        ],
        newUser: { name: '', email: '', role: 'Subscriber' },
        settings: {
          emailNotifications: true,
          autoUpdates: false,
          timezone: 'UTC',
        },
        changeView(view) {
          this.currentView = view;
        },
        saveSettings() {
          alert('Settings saved!\n' + JSON.stringify(this.settings, null, 2));
        },
        addUser() {
          const newId = this.users.length ? Math.max(...this.users.map(u => u.id)) + 1 : 1;
          this.users.push({
            id: newId,
            name: this.newUser.name,
            email: this.newUser.email,
            role: this.newUser.role,
          });
          this.newUser = { name: '', email: '', role: 'Subscriber' };
          alert('User added!');
        },
        init() {
          // Initialization if needed
        }
      }
    }
  </script>

</body></html>
